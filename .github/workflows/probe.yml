name: Probe long video sources
on:
  push:
    branches: [probe]
    paths: ['probe/probe.py', '.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o /tmp/tgpopup .
      - run: timeout 600 python3 probe/probe.py > probe/result.txt 2>&1 || true
      - if: always()
        run: |
          git config user.name "probe"
          git config user.email "probe@users.noreply.github.com"
          git add probe/result.txt
          git commit -m "probe result [skip ci]" || true
          git push
