# Render.com blueprint — in Render: "New +" → "Blueprint" → choose this repo.
# Render reads this file and sets everything up by itself.
services:
  - type: web
    name: telegram-popup
    runtime: go
    plan: free
    buildCommand: go build -trimpath -ldflags "-s -w" -o app .
    startCommand: ./app
    envVars:
      # Optional: TGPOPUP_KEY locks the site behind an access code (leave it
      # out for an open site). TGPOPUP_ADMIN_KEY unlocks the stats panel and
      # reactions for the owner: open /?admin=<value> once.
      - key: TGPOPUP_CHANNELS
        value: "elisha_yered,hakolhayehudi,realelchangr,ayeletlash,SamariaUpdates,nilchamim,hatzhalhyosh"
      - key: TZ
        value: "Asia/Jerusalem"
